name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Aynı dal için yeni bir push gelince eski koşuyu iptal et.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # SDK 58 araçları (ör. expo-doctor) Node >= 22.13 ister (bkz. AGENTS.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage -- --ci
